name: Joyride
description: 'Joyride was a mobile audio service that made driving more fun and more interesting,
  offering an in-car audio/entertainment experience for drivers and passengers. Founded by
  Jeff Chen (co-founder & CEO) and James Zhang (co-founder & CTO), the company raised a seed
  round from Cowboy Ventures and was subsequently acquired by Google, marking a successful
  exit. As a consumer mobile application it exposed no public developer API surface, and the
  product is no longer independently operated following the acquisition. This profile is
  retained in the API Evangelist network for portfolio-graph completeness rather than as an
  active API provider.'
